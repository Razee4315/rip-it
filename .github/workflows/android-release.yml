name: Android Release APK

# Release APK only (not debug). Cache keystore. Search app-universal-*.apk.
# Copy android icons over gen res after android init. Attach to existing v{version} release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: ./src-tauri -> target
          key: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rip-it-android-debug-keystore

      - name: Restore release keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/rip-it-release.keystore
          key: rip-it-android-release-keystore-v1

      - name: Generate release keystore on first run
        run: |
          mkdir -p "$HOME/.android"
          KS="$HOME/.android/rip-it-release.keystore"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v \
              -keystore "$KS" -alias rip-it \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass rip-it-release -keypass rip-it-release \
              -dname "CN=RIP IT, OU=RIP IT, O=RIP IT, L=Internet, ST=Internet, C=US"
          else
            echo "Keystore restored from cache"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Locate Android NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_DIR="$(ls -d "$SDK"/ndk/*/ 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$NDK_DIR" ]; then
            echo "::error::No Android NDK under $SDK/ndk"
            exit 1
          fi
          echo "NDK_HOME=${NDK_DIR%/}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Generate icons from logo source
        run: npx tauri icon design/logo-1024.png --output src-tauri/icons

      - name: Init Android project
        run: npx tauri android init

      - name: Copy android icons over generated res
        run: |
          set -euo pipefail
          SRC="src-tauri/icons/android"
          DEST="src-tauri/gen/android/app/src/main/res"
          if [ ! -d "$SRC" ]; then
            echo "::error::Missing $SRC after tauri icon — adaptive mipmaps required"
            ls -la src-tauri/icons || true
            exit 1
          fi
          cp -a "$SRC"/. "$DEST"/
          # Drop ONLY template foreground VECTORS (keep mipmap pngs/xml from tauri icon)
          find "$DEST" -type f \( -path '*/drawable*/ic_launcher_foreground.xml' -o -path '*/drawable*/ic_launcher_background.xml' \) -delete || true
          mkdir -p "$DEST/values"
          if ! grep -Rqs 'name="ic_launcher_background"' "$DEST/values"; then
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <color name="ic_launcher_background">#0c0e12</color>' '</resources>' > "$DEST/values/ic_launcher_background.xml"
          fi
          echo "Android res after icon overlay:"
          find "$DEST" -iname '*ic_launcher*' | sort
      - name: Write keystore.properties (no leading spaces)
        run: |
          set -euo pipefail
          KS="$HOME/.android/rip-it-release.keystore"
          {
            echo "keyAlias=rip-it"
            echo "keyPassword=rip-it-release"
            echo "storeFile=$KS"
            echo "storePassword=rip-it-release"
          } > src-tauri/gen/android/keystore.properties
          cat src-tauri/gen/android/keystore.properties

      - name: Patch Gradle release signingConfig
        run: |
          set -euo pipefail
          GRADLE="$(find src-tauri/gen/android -path '*/app/build.gradle.kts' | head -1)"
          if [ -z "$GRADLE" ]; then
            echo "::error::app/build.gradle.kts not found after android init"
            find src-tauri/gen/android -name 'build.gradle.kts' || true
            exit 1
          fi
          python3 scripts/patch-android-signing.py "$GRADLE"
          grep -n 'signingConfig\|signingConfigs\|keystore' "$GRADLE" | head -40

      - name: Build release APK (aarch64)
        run: npx tauri android build --target aarch64 --apk

      - name: Verify APK is signed + attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs -name 'app-universal-*.apk' 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then
            APK="$(find src-tauri/gen/android/app/build/outputs -name '*release*.apk' 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK found under app/build/outputs"
            find src-tauri/gen/android/app/build/outputs -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          echo "Found APK: $APK ($(wc -c < "$APK") bytes)"
          python3 scripts/verify-apk-signed.py "$APK"
          mkdir -p dist-apk
          OUT_ARM="dist-apk/RIP-IT_${VERSION}_arm64-v8a.apk"
          OUT_UNI="dist-apk/RIP-IT_${VERSION}_universal.apk"
          cp "$APK" "$OUT_ARM"
          cp "$APK" "$OUT_UNI"
          gh release upload "v${VERSION}" "$OUT_ARM" "$OUT_UNI" --clobber
          echo "Attached signed APKs to v${VERSION}"

      - name: Publish failure log tail to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Android release failed"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/apk-fail.md
          gh issue create --title "ci: Android APK release failed (${{ github.run_id }})" --body-file /tmp/apk-fail.md || true
